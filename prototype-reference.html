<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Mohafiz Case Desk</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0a0a0a;--card:#141518;--tx:#f5f5f5;--bd:#2e3342;--soft:#1a2244;--ac:#8fa6ff;--btn:#3454d2;--wn:#2e1517;--wt:#ffb9bb;--mut:#aab0c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root{--bg:#f4f6fc;--card:#fff;--tx:#0a0a0a;--bd:#cbd0e0;--soft:#e9edfb;--ac:#2a44b0;--wn:#fbe9ea;--wt:#8a1822;--mut:#3b4258}}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg)}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
button{cursor:pointer}button.p{background:var(--btn);border-color:var(--btn);color:#fff}button.on{background:var(--soft);border-color:var(--ac)}
#app{display:flex;height:100%}nav{width:210px;background:var(--soft);padding:14px 10px;overflow:auto;flex:none}
nav h2{margin:0 6px 14px;font-size:16px}nav button{display:block;width:100%;text-align:left;margin-bottom:5px;border:0;background:none}nav button.on{background:var(--btn);color:#fff}
main{flex:1;padding:18px;overflow:auto;min-width:0}h1{margin:0 0 4px;font-size:22px}.sub{color:var(--mut);margin:0 0 14px}
.kp{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.kp div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 16px;min-width:130px}.kp b{font-size:26px;display:block}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:10px}table{border-collapse:collapse;width:100%;background:var(--card)}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{background:var(--soft)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.chip{border:1px solid var(--ac);border-radius:99px;padding:1px 9px;font-size:12px}.hi{background:var(--wn);color:var(--wt);border-color:var(--wt)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.cols{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:8px;overflow-x:auto}.cols>div{background:var(--soft);border-radius:10px;padding:8px;min-height:120px}.cols .box{padding:8px;margin:6px 0;font-size:12px}
.chat{display:flex;flex-direction:column;height:60vh}.msgs{flex:1;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
.m{max-width:75%;margin-bottom:9px;padding:7px 10px;border-radius:10px;background:var(--soft)}.m.me{margin-left:auto;background:var(--btn);color:#fff}.m small{display:block;opacity:.75;font-size:11px}
.att{display:inline-block;border:1px dashed currentColor;border-radius:6px;padding:3px 8px;margin-top:3px}
.login{margin:8vh auto;max-width:360px}.login input,.login select{width:100%;margin:5px 0 10px}
.phone{width:340px;max-width:100%;margin:0 auto;border:8px solid #222;border-radius:30px;padding:14px;background:var(--bg);min-height:560px}.phone .box button{width:100%;margin-top:6px;padding:12px}
@media(max-width:700px){#app{flex-direction:column}nav{width:100%;display:flex;gap:4px;overflow-x:auto}nav h2{display:none}nav button{width:auto;white-space:nowrap}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
let C=[
{id:'POS-KAR-OCT-26-126',co:'PostEx',iss:'Payment dispute',city:'Karachi',rcv:'09:25 AM',pri:'High',st:'New',amt:37800,rec:0,cls:'—',fso:'—'},
{id:'DRZ-ISB-OCT-26-127',co:'Daraz',iss:'Verification issue',city:'Islamabad',rcv:'09:30 AM',pri:'Medium',st:'New',amt:2500,rec:0,cls:'—',fso:'—'},
{id:'BSC-LHR-OCT-26-128',co:'Buscaro',iss:'Service complaint',city:'Lahore',rcv:'09:45 AM',pri:'Low',st:'New',amt:2750,rec:0,cls:'—',fso:'—'},
{id:'POS-LHR-OCT-26-118',co:'PostEx',iss:'Theft',city:'Lahore',rcv:'08:10 AM',pri:'High',st:'In progress',amt:27950,rec:0,cls:'—',fso:'Ali Raza'},
{id:'DRZ-KAR-OCT-26-109',co:'Daraz',iss:'Fake delivery',city:'Karachi',rcv:'Yesterday',pri:'Medium',st:'Escalated',amt:16090,rec:0,cls:'—',fso:'Ahmed Khan'},
{id:'POS-ISB-OCT-26-101',co:'PostEx',iss:'Snatching',city:'Islamabad',rcv:'Mon',pri:'High',st:'Closed',amt:7000,rec:5200,cls:'Fraud',fso:'Sara Ahmed'}];
const STAGES=['New','Acknowledged','Escalated','In progress','Hold','Closed'];
const M={};const seed=(k,id,a)=>M[k+id]=a;
seed('c','POS-KAR-OCT-26-126',[{u:'PostEx user',r:'Client',t:'09:27',x:'Customer says payment was not received.'},{u:'Shoaib',r:'CRO',t:'09:31',x:'Received. Please share the payment receipt.'}]);
seed('i','POS-KAR-OCT-26-126',[{u:'Ali Raza',r:'FSO',t:'10:12',x:'Reached the location. Looks genuine.'},{u:'Ahmed',r:'SFSO',t:'10:14',x:'Noted. Please add photos.'}]);
let U=null,P='',sel=C[0].id,LOG=[],F={co:'All',city:'All',st:'All',cl:'All'};
const T=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const lg=(a,c='—')=>{if(U)LOG.unshift({u:U.name+' — '+U.role,a,c,t:T()})};
const NAV={CRO:[['today','Today'],['new','New Cases'],['board','Case Board'],['cchat','Client Updates'],['ichat','Internal Case Group'],['cls','Classification'],['rep','Reports'],['aud','Audit Logs']],
SFSO:[['esc','Escalations'],['board','Case Board'],['cchat','Client Updates'],['ichat','Internal Case Group'],['team','Field Team']],
Client:[['mine','My Cases'],['raise','Raise a Case'],['cchat','Client Updates'],['rep','Reports']],FSO:[['fso','My Cases'],['ichat','Case Group']]};
const mine=()=>U.role==='Client'?C.filter(c=>c.co===U.co):U.role==='FSO'?C.filter(c=>c.fso==='Ali Raza'):C;
function login(){const r=$('#role').value;const co=r.startsWith('Client')?r.split(' ')[1]:null;
U={role:co?'Client':r,co,name:co?co+' user':{CRO:'Shoaib',SFSO:'Ahmed',FSO:'Ali Raza'}[r]};LOG=[];lg('Signed in');go(NAV[U.role][0][0])}
function go(p){P=p;lg('Opened '+(NAV[U.role].find(n=>n[0]===p)||[0,p])[1]);draw()}
function draw(){const a=$('#app');if(!U){a.innerHTML=`<div class="login box"><h1>Mohafiz Case Desk</h1><p class="sub">Secure. Track. Resolve.</p>
<label>Email</label><input placeholder="you@company.com"><label>Password</label><input type="password" placeholder="Enter your password">
<label>Demo: sign in as</label><select id="role"><option>CRO</option><option>SFSO</option><option>FSO</option><option>Client PostEx</option><option>Client Daraz</option><option>Client Buscaro</option></select>
<button class="p" style="width:100%" onclick="login()">Sign in</button><p><a href="#" onclick="alert('A reset link will be sent to your email.');return false" style="color:var(--ac)">Forgot password?</a></p></div>`;return}
a.innerHTML=`<nav><h2>Mohafiz · ${U.role}${U.co?' · '+U.co:''}</h2>${NAV[U.role].map(n=>`<button class="${P===n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}<button onclick="U=null;draw()">Sign out</button></nav><main>${V[P]()}</main>`}
const tbl=(h,rows)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`;
const pri=p=>`<span class="chip ${p==='High'?'hi':''}">${p}</span>`;
function ack(id,send){const c=C.find(x=>x.id===id);c.st=send?'Escalated':'Acknowledged';c.fso=send?'Ali Raza':'—';lg(send?'Acknowledged & sent to SFSO':'Acknowledged',id);draw()}
function conf(id){const c=C.find(x=>x.id===id);c.st='In progress';lg('Confirmed assignment',id);draw()}
function setCls(id,v){const c=C.find(x=>x.id===id);c.cls=v;lg('Classified as '+v,id);draw()}
const sel_=k=>`<select onchange="sel=this.value;draw()">${(U.role==='Client'||k==='c'?mine():mine()).map(c=>`<option ${c.id===sel?'selected':''}>${c.id}</option>`).join('')}</select>`;
function send(k,att){const i=$('#msg');const x=att||i.value.trim();if(!x)return;(M[k+sel]=M[k+sel]||[]).push({u:U.name,r:U.role==='Client'?'Client':U.role,t:T(),x:att?'':x,a:att});lg(k==='c'?'Client message sent':'Internal message sent',sel);draw()}
function chat(k){const ok=mine();if(!ok.find(c=>c.id===sel))sel=ok[0]&&ok[0].id;const ms=M[k+sel]||[];
return `<h1>${k==='c'?'Client Updates':'Internal Case Group'}</h1><p class="sub">${k==='c'?'Talk with the client — visible to the client, CRO and SFSO.':'Staff only — CRO, SFSO and the assigned FSO. The client never sees this.'}</p>
<div class="bar">Case: ${sel_(k)} <span class="chip ${k==='c'?'':'hi'}">${k==='c'?'Shared with client':'Internal only'}</span></div>
<div class="chat"><div class="msgs">${ms.length?ms.map(m=>`<div class="m ${m.u===U.name?'me':''}"><small>${m.u} · ${m.r} · ${m.t}</small>${m.x}${m.a?`<span class="att">${m.a}</span>`:''}</div>`).join(''):'No messages yet. Start the conversation.'}</div>
<div class="bar" style="margin:8px 0 0"><input id="msg" style="flex:1" placeholder="Type a message…" onkeydown="if(event.key==='Enter')send('${k}')"><button class="p" onclick="send('${k}')">Send</button></div>
<div class="bar" style="margin-top:6px">${['Document','Image','Video','File'].map(a=>`<button onclick="send('${k}','📎 ${a.toLowerCase()}-${Math.floor(Math.random()*90+10)}')">+ ${a}</button>`).join('')}</div></div>`}
const V={
today(){const n=C.filter(c=>c.st==='New').length;return `<h1>Today</h1><p class="sub">Start at the top. Everything that needs you is here.</p><div class="kp"><div><b>${n}</b>To acknowledge</div><div><b>1</b>Updates to review</div><div><b>2</b>On hold</div><div><b>${C.filter(c=>c.st!=='Closed').length}</b>Open cases</div></div>
<div class="box"><b>Next up: acknowledge ${n} new cases</b><br><button class="p" style="margin-top:8px" onclick="go('new')">Open New Cases</button></div><div class="box"><b>Recent activity</b>${LOG.slice(0,5).map(l=>`<div>${l.t} · ${l.u} · ${l.a} ${l.c}</div>`).join('')}</div>`},
new(){const f=C.filter(c=>c.st==='New');return `<h1>New Cases</h1><p class="sub">Cases from clients or logged by you. The case ID is issued when you acknowledge.</p>
<div class="bar"><select><option>All companies</option></select><select><option>All cities</option></select><select><option>All priorities</option></select><button class="p" onclick="alert('Log a case: client, issue, city, amount, description, source channel.')">+ Log a case</button></div>
${f.length?tbl(['Case ID','Raised By','Issue','City','Received','Priority','Status','Actions'],f.map(c=>[c.id,'<b>'+c.co+'</b>',c.iss,c.city,c.rcv,pri(c.pri),'New',`<button class="p" onclick="ack('${c.id}',1)">Acknowledge &amp; send to SFSO</button> <button onclick="ack('${c.id}',0)">Acknowledge only</button>`])):'<div class="box">No new cases. Nothing to acknowledge.</div>'}`},
board(){return `<h1>Case Board</h1><p class="sub">Six stages. Each card shows the company.</p><div class="cols">${STAGES.map(s=>`<div><b>${s}</b>${C.filter(c=>c.st===s).map(c=>`<div class="box"><b>${c.id}</b><br>${c.co} · ${c.city}<br>${c.iss}</div>`).join('')}</div>`).join('')}</div>`},
cchat:()=>chat('c'),ichat:()=>chat('i'),
cls(){return `<h1>Classification</h1><p class="sub">After the FSO reports in the case group, set the case as Genuine, Negligence or Fraud. It saves to Reports.</p>${tbl(['Case ID','Raised By','Issue','Status','Classification'],C.filter(c=>c.st!=='New').map(c=>[c.id,c.co,c.iss,c.st,`<select onchange="setCls('${c.id}',this.value)">${['—','Genuine','Negligence','Fraud'].map(o=>`<option ${o===c.cls?'selected':''}>${o}</option>`).join('')}</select>`]))}`},
rep(){const f=mine().filter(c=>(F.co==='All'||c.co===F.co)&&(F.city==='All'||c.city===F.city)&&(F.st==='All'||c.st===F.st)&&(F.cl==='All'||c.cls===F.cl));
const s=(k,o)=>`<select onchange="F.${k}=this.value;draw()">${['All',...o].map(x=>`<option ${F[k]===x?'selected':''}>${x}</option>`).join('')}</select>`;
return `<h1>Reports</h1><p class="sub">${U.role==='Client'?'Reports for '+U.co+' only.':'Generate reports for all companies, one company, a city or a single case.'}</p>
<div class="bar">From <input type="date"> To <input type="date">${U.role==='Client'?'':s('co',['PostEx','Daraz','Buscaro'])}${s('city',['Karachi','Lahore','Islamabad'])}${s('st',STAGES)}${s('cl',['Genuine','Negligence','Fraud'])}<button onclick="F={co:'All',city:'All',st:'All',cl:'All'};draw()">Reset</button><button class="p" onclick="lg('Exported report');alert('CSV exported with '+${f.length}+' rows.')">Export CSV</button></div>
<div class="kp"><div><b>${f.length}</b>Cases</div><div><b>${f.reduce((a,c)=>a+c.amt,0).toLocaleString()}</b>Total amount (PKR)</div><div><b>${f.reduce((a,c)=>a+c.rec,0).toLocaleString()}</b>Recovered (PKR)</div></div>
${tbl(['Case ID','Raised By','Date Reported','Incident Type','Classification','Total Amount','Recovered','City','Status'],f.map(c=>[c.id,c.co,c.rcv,c.iss,c.cls,c.amt.toLocaleString(),c.rec.toLocaleString(),c.city,c.st]))}`},
aud(){return `<h1>Audit Logs</h1><p class="sub">Every user action, recorded and append-only. Sign-ins and tab opens you make in this demo appear here live.</p>${tbl(['User','Activity','Case ID','Time'],LOG.map(l=>[l.u,l.a,l.c,l.t]))}`},
esc(){const f=C.filter(c=>c.st==='Escalated');return `<h1>Escalations</h1><p class="sub">Confirm the field officer or change them.</p>${f.length?tbl(['Case ID','Raised By','City','Officer','Action'],f.map(c=>[c.id,c.co,c.city,c.fso,`<button class="p" onclick="conf('${c.id}')">Confirm assignment</button>`])):'<div class="box">Nothing to confirm.</div>'}`},
team(){return `<h1>Field Team</h1><p class="sub">Officer workload.</p>${tbl(['Officer','City','Active cases','On hold'],[['Ali Raza','Lahore',1,0],['Ahmed Khan','Karachi',1,0],['Sara Ahmed','Islamabad',0,0]])}`},
mine(){const f=mine();return `<h1>My Cases</h1><p class="sub">${U.co} cases only.</p><div class="kp"><div><b>${f.filter(c=>c.st!=='Closed').length}</b>Open</div><div><b>${f.filter(c=>c.st==='Closed').length}</b>Closed</div><div><b>0</b>Waiting for you</div></div>${tbl(['Case','Issue','City','Status'],f.map(c=>[c.id,c.iss,c.city,c.st==='New'?'Received, waiting to be acknowledged':c.st==='Closed'?'Closed':'Being handled']))}`},
raise(){return `<h1>Raise a Case</h1><div class="box" style="max-width:480px"><select style="width:100%;margin:4px 0"><option>Issue type</option><option>Customer Issue</option><option>Fake Delivery</option><option>Snatching</option><option>Theft</option></select><select style="width:100%;margin:4px 0"><option>City</option><option>Karachi</option><option>Lahore</option><option>Islamabad</option></select><input style="width:100%;margin:4px 0" placeholder="Area or address"><input style="width:100%;margin:4px 0" placeholder="Amount (PKR)"><textarea style="width:100%;margin:4px 0" rows="3" placeholder="What happened (min 20 characters)"></textarea><button class="p" onclick="lg('Raised a case');alert('Case received. The ID appears after acknowledgement.')">Send case</button></div>`},
fso(){const f=mine();return `<div class="phone"><h2 style="margin-top:0">My cases</h2>${f.map(c=>`<div class="box"><b>${c.id}</b><br>${c.co} · ${c.iss} · ${c.city}<br><span class="chip">${c.st}</span><button class="p" onclick="lg('Accepted case','${c.id}');alert('Accepted. Location tracking started.')">Accept case</button><button onclick="lg('Confirmed arrival','${c.id}');alert('Arrival confirmed (GPS 40 m from pin).')">Confirm arrival</button><button onclick="lg('Submitted report','${c.id}');alert('Report sent. Photos and voice notes attached.')">Send report</button></div>`).join('')}</div>`}
};
draw();
</script></body></html>
